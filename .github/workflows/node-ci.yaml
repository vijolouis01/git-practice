name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  html-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Create test report
        run: |
          echo "HTML validation completed successfully." > test-report.txt
          echo "Repository: $GITHUB_REPOSITORY" >> test-report.txt
          echo "Commit: $GITHUB_SHA" >> test-report.txt

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: html-test-report
          path: test-report.txt  